<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Front desk</title>
    <link rel="stylesheet" href="/webmcp.css" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main>
      <h1>Front desk</h1>
      <p id="status" role="status" aria-live="polite">Loading front desk.</p>

      <section id="visit" aria-labelledby="visit-heading">
        <h2 id="visit-heading">Visit</h2>
        <p id="visit-summary">No visit yet</p>
        <ol id="visit-steps" aria-label="Visit steps"></ol>
      </section>

      <section aria-labelledby="appointments-heading">
        <h2 id="appointments-heading">Appointments</h2>
        <ul id="appointments" role="list" aria-label="Appointments"></ul>
      </section>

      <section aria-labelledby="request-heading">
        <h2 id="request-heading">Support request</h2>
        <form
          id="file-request"
          method="post"
          action="/file-request"
          toolname="file_request"
          tooldescription="File a support request after book_slot. Requires name, topic, and details."
          toolautosubmit
        >
          <label for="name">Name</label>
          <input id="name" name="name" type="text" required autocomplete="name" />

          <label for="topic">Topic</label>
          <select
            id="topic"
            name="topic"
            required
            toolparamdescription="Request topic: access, billing, or other."
          >
            <option value="access">Access</option>
            <option value="billing">Billing</option>
            <option value="other">Other</option>
          </select>

          <label for="details">Details</label>
          <input
            id="details"
            name="details"
            type="text"
            required
            toolparamdescription="Short description of the request."
          />

          <button type="submit">File request</button>
        </form>
        <ul id="requests" role="list" aria-label="Requests"></ul>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
